<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astro Health Station -- Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<!-- Standalone page, not part of the main SPA (no Socket.IO/Chart.js/main.js
     Tabs system) -- a separate superuser login, kept deliberately apart from
     the astronaut/Flight-Surgeon login (docs/CLAUDE.md's "Superuser admin
     page"). Reuses style.css for visual consistency only. -->
<div id="admin-login-screen" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div class="card" style="max-width:420px; width:100%; margin:20px;">
    <h2 style="margin-top:0;">Admin sign in</h2>
    <p class="dim">Superuser login, separate from the crew/Flight-Surgeon NFC login.</p>
    <label>Username</label>
    <input id="admin-username" autocomplete="username">
    <label>Password</label>
    <input id="admin-password" type="password" autocomplete="current-password">
    <button class="btn" id="admin-login-btn" style="width:100%;">Sign in</button>
    <div id="admin-login-error" class="dim" style="margin-top:10px; min-height:1.2em;"></div>
  </div>
</div>

<div id="admin-app" style="display:none; max-width:900px; margin:0 auto; padding:20px;">
  <header style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
    <h1 style="margin:0;">Admin</h1>
    <div style="display:flex; gap:10px; align-items:center;">
      <span id="admin-user-pill" class="pill">&ndash;</span>
      <button class="btn secondary" id="admin-logout-btn" style="padding:4px 10px; font-size:0.85rem;">Log out</button>
    </div>
  </header>

  <div class="card" id="admin-unknown-card">
    <h3>Unknown tags</h3>
    <p class="dim">Cards/tags tapped on the CYD that aren't assigned to anything yet. Stays here
      until you assign or dismiss it -- not lost just because nobody was watching.</p>
    <div id="admin-unknown-list"></div>
  </div>

  <div class="card">
    <h3>Tag registry</h3>
    <table style="width:100%; border-collapse:collapse" id="admin-tags-table"></table>
  </div>
</div>

<script src="{{ url_for('static', filename='js/admin_page.js') }}"></script>
</body>
</html>
